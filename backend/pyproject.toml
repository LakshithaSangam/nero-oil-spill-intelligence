[project]
name = "neuro-backend"
version = "0.1.0"
description = "Neuro — maritime oil spill intelligence backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/services/report_generator.py" = ["E501"]  # HTML / markdown template literals

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
